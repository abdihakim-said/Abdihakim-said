<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Abdihakim Said — Cloud &amp; Platform Engineer">
  <style>
    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 0.9s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .link { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.4s ease-in-out 0.6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .n2 { animation-delay: 0.7s; } .n3 { animation-delay: 1.4s; } .n4 { animation-delay: 2.1s; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { .fade, .link, .node { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="0.55" stop-color="#1f4f86"/>
      <stop offset="1" stop-color="#2c7a8c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#g)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <path class="link" d="M1020 70 L1100 130 L990 185 L1130 210" fill="none" stroke="#7fd1d9" stroke-opacity="0.45" stroke-width="2"/>
  <g fill="#7fd1d9">
    <circle class="node" cx="1020" cy="70" r="7"/>
    <circle class="node n2" cx="1100" cy="130" r="7"/>
    <circle class="node n3" cx="990" cy="185" r="7"/>
    <circle class="node n4" cx="1130" cy="210" r="5"/>
  </g>
  <circle r="4" fill="#ffffff" opacity="0.9">
    <animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M1020 70 L1100 130 L990 185 L1130 210"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <text class="fade d1" x="64" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Abdihakim Said</text>
  <text class="fade d2" x="64" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#d6e6f5">Cloud &amp; Platform Engineer · Founder, HumanLayer AI Ltd</text>
  <text class="fade d3" x="64" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9fc3df">AWS · Azure · Kubernetes · Terraform · DevSecOps · AI with guardrails</text>
</svg>
